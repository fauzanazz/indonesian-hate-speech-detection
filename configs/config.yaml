# Main configuration file for toxicity detection system
# BEAM Configuration: Centralized settings for reproducible experiments

defaults:
  - training: default
  - models: tfidf
  - _self_

# Data configuration
data:
  path: "dataset/indonesian_hate_speech.csv"
  test_size: 0.2
  val_size: 0.1
  random_state: 42
  stratify: true

# Experiment tracking
experiment:
  name: "toxicity_detection"
  run_name: null  
  output_dir: "outputs"
  save_models: true
  save_predictions: true

# Logging
logging:
  level: "INFO"
  log_file: "logs/training.log"

# Random seed for reproducibility
seed: 42

# Evaluation
evaluation:
  compute_slice_metrics: true
  measure_latency: true
  save_error_analysis: true
